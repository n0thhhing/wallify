name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Swift
    runs-on: xcode-27-arm64
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          bash tests/build_cache.sh
          ./scripts/build.sh -O Debug --test

      - name: Build optional Inspector
        run: ./scripts/build.sh -O Debug --debug-inspector

      - name: Build ReleaseFast
        run: ./scripts/build.sh -O ReleaseFast

      - name: Package macOS app
        run: ./scripts/package-app.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Wallify-macos-arm64
          path: build/Wallify.app
          if-no-files-found: error
          retention-days: 7
