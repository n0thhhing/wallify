name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Zig 0.16
    runs-on: xcode-27-arm64
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Zig
        uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0

      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: \${{ runner.os }}-zig-0.16-\${{ github.ref_name }}-\${{ hashFiles('build.zig', 'build.zig.zon', 'src/**/*.zig', 'src/**/*.m', 'src/**/*.mm', 'src/**/*.h', 'src/**/*.metal') }}
          restore-keys: |
            \${{ runner.os }}-zig-0.16-\${{ github.ref_name }}-
            \${{ runner.os }}-zig-0.16-

      - name: Check Zig formatting
        run: zig fmt --check \$(git ls-files '*.zig')

      - name: Run tests
        run: zig build test -Doptimize=Debug -Ddebug-inspector=false --summary all

      - name: Build ReleaseFast
        run: zig build -Doptimize=ReleaseFast --summary all

      - name: Package macOS app
        run: ./scripts/package-app.sh

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Wallify-macos-arm64
          path: zig-out/Wallify.app
          if-no-files-found: error
          retention-days: 7
