# Kitty configuration for the Wallify desktop player.
# Loaded explicitly by run-desktop.sh; independent of ~/.config/kitty/kitty.conf.

# Transparent outside the rendered card; no dimming when unfocused.
background black
background_opacity 0
inactive_text_alpha 1

# Borderless widget with no terminal chrome or scrollbar.
hide_window_decorations yes
tab_bar_style hidden
scrollbar never
scrollbar_interactive no
window_padding_width 0
window_margin_width 0
single_window_padding_width 0
single_window_margin_width 0

# Anchor the image and mouse coordinates consistently at the top left.
placement_strategy top-left

# Only the local panel socket can issue the live resize used for widget modes.
allow_remote_control yes
